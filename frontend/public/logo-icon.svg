<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <clipPath id="left-clip">
      <circle cx="35" cy="50" r="32"/>
    </clipPath>
    <linearGradient id="amber-glow-icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-amber, #C4933F)"/>
      <stop offset="100%" stop-color="var(--color-amber-light, #D4A85A)"/>
    </linearGradient>
    <linearGradient id="ink-grad-icon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--color-ink, #243442)"/>
      <stop offset="100%" stop-color="var(--color-ink-light, #2F4A5A)"/>
    </linearGradient>
    <linearGradient id="moss-grad-icon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--color-moss, #6B8C7A)"/>
      <stop offset="100%" stop-color="var(--color-moss-light, #8FAD9E)"/>
    </linearGradient>
    <filter id="soft-shadow-icon" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="var(--color-ink, #243442)" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#soft-shadow-icon)">
    <!-- Left circle - Person 1 (Ink) -->
    <circle cx="35" cy="50" r="32" fill="url(#ink-grad-icon)"/>

    <!-- Right circle - Person 2 (Moss) -->
    <circle cx="65" cy="50" r="32" fill="url(#moss-grad-icon)"/>

    <!-- Overlap area - Connection (Amber) -->
    <circle cx="65" cy="50" r="32" fill="url(#amber-glow-icon)" clip-path="url(#left-clip)"/>

    <!-- Heart in the center -->
    <path d="M50,68 C50,68 32,54 32,42 C32,32 42,30 50,42 C58,30 68,32 68,42 C68,54 50,68 50,68Z"
          fill="white" fill-opacity="0.92"/>

    <!-- Person silhouettes -->
    <circle cx="30" cy="40" r="5" fill="white" fill-opacity="0.15"/>
    <path d="M22,58 C22,50 26,46 30,46 C34,46 38,50 38,58" fill="white" fill-opacity="0.1"/>
    <circle cx="70" cy="40" r="5" fill="white" fill-opacity="0.15"/>
    <path d="M62,58 C62,50 66,46 70,46 C74,46 78,50 78,58" fill="white" fill-opacity="0.1"/>
  </g>

  <!-- Connection sparkles -->
  <circle cx="50" cy="12" r="2.5" fill="var(--color-amber, #C4933F)" opacity="0.7"/>
  <circle cx="40" cy="8" r="1.5" fill="var(--color-amber, #C4933F)" opacity="0.45"/>
  <circle cx="60" cy="8" r="1.5" fill="var(--color-amber, #C4933F)" opacity="0.45"/>
  <circle cx="45" cy="5" r="1" fill="var(--color-amber, #C4933F)" opacity="0.3"/>
  <circle cx="55" cy="5" r="1" fill="var(--color-amber, #C4933F)" opacity="0.3"/>
</svg>
