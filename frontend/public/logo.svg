<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <defs>
    <clipPath id="left-clip-full">
      <circle cx="38" cy="50" r="30"/>
    </clipPath>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-amber, #C4933F)" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="var(--color-amber-light, #D4A85A)" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="ink-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--color-ink, #243442)"/>
      <stop offset="100%" stop-color="var(--color-ink-light, #2F4A5A)"/>
    </linearGradient>
    <linearGradient id="moss-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--color-moss, #6B8C7A)"/>
      <stop offset="100%" stop-color="var(--color-moss-light, #8FAD9E)"/>
    </linearGradient>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Abstract figure left - representing person -->
    <path d="M20,50 Q20,20 40,20 Q50,20 50,30 Q50,40 40,45 Q55,48 55,65 Q55,72 45,72 L30,72 Q20,72 20,65 Z"
          fill="url(#ink-grad)" opacity="0.9"/>

    <!-- Abstract figure right - representing friend -->
    <path d="M60,50 Q60,20 80,20 Q90,20 90,30 Q90,40 80,45 Q95,48 95,65 Q95,72 85,72 L70,72 Q60,72 60,65 Z"
          fill="url(#moss-grad)" opacity="0.9"/>

    <!-- Connection bridge - the friendship link -->
    <path d="M45,35 Q50,25 55,35" fill="none" stroke="url(#amber-glow)" stroke-width="3" stroke-linecap="round"/>

    <!-- Heart at connection point -->
    <path d="M50,38 C50,38 44,32 44,28 C44,25 47,24 50,28 C53,24 56,25 56,28 C56,32 50,38 50,38Z"
          fill="var(--color-amber, #C4933F)" opacity="0.9"/>

    <!-- Subtle sparkles around connection -->
    <circle cx="50" cy="18" r="1.5" fill="var(--color-amber, #C4933F)" opacity="0.5"/>
    <circle cx="42" cy="15" r="1" fill="var(--color-amber, #C4933F)" opacity="0.3"/>
    <circle cx="58" cy="15" r="1" fill="var(--color-amber, #C4933F)" opacity="0.3"/>
    <circle cx="50" cy="10" r="0.8" fill="var(--color-amber, #C4933F)" opacity="0.2"/>

    <!-- Ground connection line -->
    <path d="M25,72 Q50,78 95,72" fill="none" stroke="var(--color-pebble, #D5CFC6)" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Text -->
  <text x="120" y="58" font-family="Georgia, 'Times New Roman', serif"
        font-size="50" font-weight="400" letter-spacing="1" fill="var(--color-ink, #243442)">
    Friendzy
  </text>

  <!-- Subtle tagline line -->
  <line x1="120" y1="70" x2="275" y2="70" stroke="var(--color-amber, #C4933F)" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Tagline -->
  <text x="120" y="82" font-family="Inter, system-ui, sans-serif"
        font-size="10" font-weight="400" letter-spacing="2" fill="var(--color-slate, #5A7585)" opacity="0.7">
    FIND YOUR PEOPLE
  </text>
</svg>
