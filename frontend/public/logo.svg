<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <defs>
    <clipPath id="left-clip-full">
      <circle cx="38" cy="50" r="30"/>
    </clipPath>
  </defs>

  <!-- === ICON MARK === -->
  <g transform="translate(10, 0)">
    <!-- Left circle - Person 1 (Ink) -->
    <circle cx="38" cy="50" r="30" fill="#243442"/>

    <!-- Right circle - Person 2 (Moss) -->
    <circle cx="62" cy="50" r="30" fill="#6B8C7A"/>

    <!-- Overlap area - Connection (Amber) -->
    <circle cx="62" cy="50" r="30" fill="#C4933F" clip-path="url(#left-clip-full)"/>

    <!-- Heart in the center of the overlap -->
    <path d="M50,64 C50,64 36,54 36,44 C36,36 44,34 50,44 C56,34 64,36 64,44 C64,54 50,64 50,64Z"
          fill="#FFFFFF" fill-opacity="0.95"/>

    <!-- Connection sparkles -->
    <circle cx="50" cy="30" r="2" fill="#C4933F" opacity="0.6"/>
    <circle cx="42" cy="26" r="1.2" fill="#C4933F" opacity="0.4"/>
    <circle cx="58" cy="26" r="1.2" fill="#C4933F" opacity="0.4"/>
  </g>

  <!-- === TEXT === -->
  <text x="118" y="62" font-family="Georgia, 'Times New Roman', serif"
        font-size="52" font-weight="400" letter-spacing="1" fill="#243442">
    Friendzy
  </text>

  <!-- Subtle accent line -->
  <line x1="118" y1="74" x2="268" y2="74" stroke="#C4933F" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
</svg>
